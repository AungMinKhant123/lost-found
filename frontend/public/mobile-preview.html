<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Mobile preview</title>
    <style>
      html, body { margin: 0; padding: 0; background: #fff; }
      iframe { display: block; border: 0; width: 390px; height: 844px; }
    </style>
  </head>
  <body>
    <iframe id="f"></iframe>
    <script>
      const page = new URLSearchParams(location.search).get("p") || "about-us";
      document.getElementById("f").src = "/" + page;
    </script>
  </body>
</html>
